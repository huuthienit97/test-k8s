# Layout api+web — branch feature/minio-files.
# health /health → probe /api/health. App cũng có /api/healthz.
version: 1
layout: multi
services:
  - name: api
    path: backend
    dockerfile: backend/Dockerfile
    port: 8080
    health: /health
    ingress: /api
    expose: true
  - name: web
    path: frontend
    dockerfile: frontend/Dockerfile
    port: 8080
    health: /
    ingress: /
    expose: true
