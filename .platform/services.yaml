# Layout api+web — branch feature/minio-files.
# path = Docker build context (bắt buộc backend/frontend, không dùng ".").
version: 1
layout: multi
services:
  - name: api
    path: backend
    dockerfile: backend/Dockerfile
    port: 8080
    health: /healthz
    ingress: /api
    expose: true
  - name: web
    path: frontend
    dockerfile: frontend/Dockerfile
    port: 8080
    health: /
    ingress: /
    expose: true
