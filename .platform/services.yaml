# Layout api+web — khớp branch feature/minio-files (upload MinIO).
# Contract field: path (hoặc build_context). Không dùng source_dir.
version: 1
layout: multi
services:
  - name: api
    path: backend
    dockerfile: backend/Dockerfile
    port: 8080
    health: /healthz
    ingress: /api
    expose: true
  - name: web
    path: frontend
    dockerfile: frontend/Dockerfile
    port: 80
    health: /
    ingress: /
    expose: true
